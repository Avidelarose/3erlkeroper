<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball: Infinite Universe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #000428 100%);
        }

        .ui-overlay {
            position: absolute;
            pointer-events: none;
        }

        .stats-panel {
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ff8c00;
            border-radius: 10px;
            padding: 15px;
            min-width: 250px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.5);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            align-items: center;
        }

        .stat-label {
            color: #00d4ff;
        }

        .stat-value {
            color: #ff8c00;
            font-weight: bold;
        }

        .bar-container {
            width: 150px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #555;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .hp-bar { background: linear-gradient(90deg, #ff0000, #ff8c00); }
        .ki-bar { background: linear-gradient(90deg, #00d4ff, #ff8c00); }
        .xp-bar { background: linear-gradient(90deg, #9900ff, #ff00ff); }

        .controls-panel {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ff8c00;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .btn {
            background: linear-gradient(135deg, #ff8c00, #ff6600);
            border: none;
            color: #000;
            padding: 12px 20px;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 12px;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-space {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }

        .btn-attack {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
        }

        .btn-special {
            background: linear-gradient(135deg, #9900ff, #ff00ff);
            color: white;
        }

        .quest-panel {
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #9900ff;
            border-radius: 10px;
            padding: 15px;
            min-width: 300px;
            max-height: 300px;
            overflow-y: auto;
        }

        .quest-item {
            background: rgba(153, 0, 255, 0.2);
            border: 2px solid #9900ff;
            border-radius: 8px;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quest-item:hover {
            background: rgba(153, 0, 255, 0.4);
            transform: translateX(-5px);
        }

        .quest-title {
            color: #ff8c00;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .quest-desc {
            font-size: 0.9em;
            color: #aaa;
        }

        .quest-reward {
            color: #00ff00;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .travel-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .travel-content {
            background: linear-gradient(135deg, #0a0e27, #1a1f4d);
            border: 3px solid #00d4ff;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
        }

        .rocket-icon {
            font-size: 5em;
            margin: 20px 0;
            animation: float 2s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .coord-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .coord-input input {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00d4ff;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            width: 100px;
            text-align: center;
        }

        .planet-info {
            background: rgba(255, 140, 0, 0.1);
            border: 2px solid #ff8c00;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }

        .weather-indicator {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1.2em;
        }

        .inventory-panel {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ff8c00;
            border-radius: 10px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 50px);
            gap: 5px;
            margin-top: 10px;
        }

        .inv-slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #555;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .inv-slot:hover {
            border-color: #ff8c00;
            background: rgba(255, 140, 0, 0.2);
        }

        .message-log {
            position: absolute;
            bottom: 100px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 10px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9em;
        }

        .message {
            margin: 3px 0;
            padding: 3px;
            border-left: 3px solid #ff8c00;
            padding-left: 8px;
        }

        .hidden {
            display: none !important;
        }

        .power-list {
            position: absolute;
            bottom: 100px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #9900ff;
            border-radius: 10px;
            padding: 15px;
        }

        .power-item {
            background: rgba(153, 0, 255, 0.2);
            border: 2px solid #9900ff;
            border-radius: 8px;
            padding: 8px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .power-item:hover {
            background: rgba(153, 0, 255, 0.4);
        }

        .power-item.unlocked {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.2);
        }

        .power-item.locked {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-overlay stats-panel">
        <div class="stat-row">
            <span class="stat-label">❤️ Здоровье:</span>
            <div class="bar-container">
                <div class="bar-fill hp-bar" id="hpBar" style="width: 100%"></div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label">⚡ Ки:</span>
            <div class="bar-container">
                <div class="bar-fill ki-bar" id="kiBar" style="width: 100%"></div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label">⭐ Уровень:</span>
            <span class="stat-value" id="levelVal">1</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">💪 Сила:</span>
            <div class="bar-container">
                <div class="bar-fill xp-bar" id="xpBar" style="width: 0%"></div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-label"> Координаты:</span>
            <span class="stat-value" id="coords">0, 0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">🪐 Планета:</span>
            <span class="stat-value" id="planetName">Земля</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">💰 Зени:</span>
            <span class="stat-value" id="zeni">0</span>
        </div>
    </div>

    <div class="weather-indicator" id="weatherDisplay">☀️ Ясно</div>

    <div class="ui-overlay quest-panel">
        <h3 style="color: #ff8c00; margin-bottom: 10px; border-bottom: 2px solid #9900ff; padding-bottom: 5px;">📜 Активные задания</h3>
        <div id="questList"></div>
    </div>

    <div class="ui-overlay inventory-panel">
        <h3 style="color: #ff8c00; margin-bottom: 10px;">🎒 Инвентарь</h3>
        <div class="inventory-grid" id="inventory"></div>
    </div>

    <div class="ui-overlay power-list">
        <h3 style="color: #ff8c00; margin-bottom: 10px;">⚡ Способности</h3>
        <div id="powersList"></div>
    </div>

    <div class="message-log" id="messageLog"></div>

    <div class="ui-overlay controls-panel">
        <button class="btn btn-space" onclick="openTravel()">🚀 Лететь</button>
        <button class="btn btn-attack" onclick="attack()">⚔️ Атака</button>
        <button class="btn btn-special" onclick="useSpecial()">✨ Ки-бласт</button>
        <button class="btn" onclick="gather()">⛏️ Добыть</button>
        <button class="btn" onclick="build()">🔨 Строить</button>
    </div>

    <div class="travel-modal" id="travelModal">
        <div class="travel-content">
            <div class="rocket-icon">🚀</div>
            <h2 style="color: #00d4ff; margin-bottom: 20px;">МЕЖПЛАНЕТНЫЙ ПЕРЕЛЕТ</h2>
            
            <div class="planet-info">
                <div style="color: #ff8c00; margin-bottom: 10px;">Текущая планета: <span id="currentPlanetInfo">Земля</span></div>
                <div style="color: #00ff00;">Погода: <span id="travelWeather">☀️ Ясно</span></div>
            </div>

            <div class="coord-input">
                <input type="number" id="coordX" placeholder="X" value="0">
                <input type="number" id="coordY" placeholder="Y" value="0">
                <input type="number" id="coordZ" placeholder="Z (глубина)" value="0">
            </div>

            <div style="margin: 20px 0;">
                <button class="btn btn-space" onclick="travelToRandom()" style="margin: 5px;">🎲 Случайная планета</button>
                <button class="btn" onclick="travelToCoords()" style="margin: 5px;">📍 По координатам</button>
                <button class="btn" onclick="closeTravel()" style="margin: 5px; background: #666;">❌ Отмена</button>
            </div>

            <div id="travelInfo" style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.5); border-radius: 10px; display: none;">
                <h3 style="color: #ff8c00;">Информация о планете:</h3>
                <div id="planetDetails"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Игровые константы
        const WORLD_SIZE = 10000;
        const CHUNK_SIZE = 16;
        const BLOCK_SIZE = 32;

        // Игрок
        const player = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            z: 0,
            hp: 100,
            maxHp: 100,
            ki: 100,
            maxKi: 100,
            level: 1,
            xp: 0,
            xpToNext: 100,
            power: 1000,
            zeni: 0,
            inventory: [],
            powers: ['ki_blast'],
            unlockedPowers: ['kamehameha'],
            speed: 5,
            flying: false
        };

        // Текущая планета
        let currentPlanet = {
            name: 'Земля',
            x: 0,
            y: 0,
            z: 0,
            type: 'earth',
            weather: 'clear',
            gravity: 1,
            mobs: [],
            resources: [],
            structures: [],
            satellites: ['Луна'],
            sun: 'Солнце',
            temperature: 20,
            atmosphere: true
        };

        // Генератор случайных чисел с seed
        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Типы планет
        const planetTypes = [
            { name: 'earth', emoji: '🌍', gravity: 1, temp: 20, atmosphere: true },
            { name: 'namek', emoji: '🟢', gravity: 0.8, temp: 25, atmosphere: true },
            { name: 'vegeta', emoji: '🔴', gravity: 1.5, temp: 45, atmosphere: true },
            { name: 'frieza', emoji: '❄️', gravity: 1.2, temp: -50, atmosphere: true },
            { name: 'cell', emoji: '🟢', gravity: 1.1, temp: 35, atmosphere: true },
            { name: 'kaio', emoji: '🔵', gravity: 10, temp: 30, atmosphere: true },
            { name: 'void', emoji: '⚫', gravity: 0.1, temp: -270, atmosphere: false },
            { name: 'lava', emoji: '🌋', gravity: 1.3, temp: 500, atmosphere: false }
        ];

        // Погода
        const weatherTypes = [
            { name: 'clear', emoji: '☀️', chance: 0.5 },
            { name: 'cloudy', emoji: '☁️', chance: 0.2 },
            { name: 'rain', emoji: '🌧️', chance: 0.15 },
            { name: 'storm', emoji: '⛈️', chance: 0.1 },
            { name: 'aurora', emoji: '🌌', chance: 0.05 }
        ];

        // Мобы
        const mobTypes = [
            { name: 'Saibaman', emoji: '👾', hp: 50, power: 500, xp: 50, zeni: 100 },
            { name: 'Nappa', emoji: '💪', hp: 200, power: 2000, xp: 200, zeni: 500 },
            { name: 'Raditz', emoji: '😈', hp: 150, power: 1500, xp: 150, zeni: 300 },
            { name: 'Frieza Soldier', emoji: '🤖', hp: 100, power: 1000, xp: 100, zeni: 200 },
            { name: 'Cell Jr', emoji: '🦗', hp: 180, power: 3000, xp: 300, zeni: 600 },
            { name: 'Majin', emoji: '👹', hp: 250, power: 2500, xp: 250, zeni: 400 },
            { name: 'Android', emoji: '🤖', hp: 300, power: 4000, xp: 400, zeni: 800 },
            { name: 'God of Destruction', emoji: '👑', hp: 1000, power: 10000, xp: 1000, zeni: 5000 }
        ];

        // Ресурсы
        const resources = [
            { name: 'Dragon Stone', emoji: '🔮', rarity: 0.01, value: 1000 },
            { name: 'Ki Crystal', emoji: '💎', rarity: 0.05, value: 500 },
            { name: 'Senzu Bean', emoji: '🫘', rarity: 0.02, value: 800 },
            { name: 'Metal', emoji: '🔩', rarity: 0.2, value: 50 },
            { name: 'Wood', emoji: '🪵', rarity: 0.3, value: 20 },
            { name: 'Stone', emoji: '🪨', rarity: 0.4, value: 10 }
        ];

        // Задания
        let quests = [];
        const questTemplates = [
            { title: 'Уничтожить врагов', desc: 'Победите {count} врагов', reward: { xp: 500, zeni: 1000 }, type: 'kill' },
            { title: 'Собрать ресурсы', desc: 'Найдите {count} ресурсов', reward: { xp: 300, zeni: 500 }, type: 'gather' },
            { title: 'Исследовать планеты', desc: 'Посетите {count} планет', reward: { xp: 1000, zeni: 2000 }, type: 'explore' },
            { title: 'Прокачать уровень', desc: 'Достигните уровня {level}', reward: { xp: 2000, zeni: 3000 }, type: 'level' },
            { title: 'Освоить технику', desc: 'Изучите новую способность', reward: { xp: 1500, zeni: 2500 }, type: 'power' }
        ];

        // Генерация планеты
        function generatePlanet(x, y, z) {
            const seed = Math.abs(x * 1000 + y * 100 + z);
            const typeIdx = Math.floor(seededRandom(seed) * planetTypes.length);
            const type = planetTypes[typeIdx];
            
            // Генерация погоды
            const weatherRoll = seededRandom(seed + 1);
            let weather = weatherTypes[0];
            let cumulative = 0;
            for (let w of weatherTypes) {
                cumulative += w.chance;
                if (weatherRoll <= cumulative) {
                    weather = w;
                    break;
                }
            }

            // Генерация спутников
            const satellites = [];
            const satCount = Math.floor(seededRandom(seed + 2) * 4);
            for (let i = 0; i < satCount; i++) {
                satellites.push(`Спутник-${Math.floor(seededRandom(seed + i) * 100)}`);
            }

            // Генерация мобов
            const mobs = [];
            const mobCount = Math.floor(seededRandom(seed + 3) * 5) + 2;
            for (let i = 0; i < mobCount; i++) {
                const mobType = mobTypes[Math.floor(seededRandom(seed + i + 4) * mobTypes.length)];
                mobs.push({
                    ...mobType,
                    x: seededRandom(seed + i + 5) * 1000,
                    y: seededRandom(seed + i + 6) * 1000,
                    currentHp: mobType.hp,
                    id: i
                });
            }

            // Генерация ресурсов
            const res = [];
            const resCount = Math.floor(seededRandom(seed + 7) * 10) + 5;
            for (let i = 0; i < resCount; i++) {
                const resType = resources[Math.floor(seededRandom(seed + i + 8) * resources.length)];
                res.push({
                    ...resType,
                    x: seededRandom(seed + i + 9) * 1000,
                    y: seededRandom(seed + i + 10) * 1000,
                    amount: Math.floor(seededRandom(seed + i + 11) * 10) + 1
                });
            }

            return {
                name: `Planet-${Math.abs(x)}-${Math.abs(y)}-${Math.abs(z)}`,
                x, y, z,
                type: type.name,
                emoji: type.emoji,
                gravity: type.gravity,
                temperature: type.temp,
                atmosphere: type.atmosphere,
                weather: weather.name,
                weatherEmoji: weather.emoji,
                satellites,
                sun: `Star-${Math.floor(seededRandom(seed + 12) * 1000)}`,
                mobs,
                resources: res,
                structures: generateStructures(seed),
                discovered: false
            };
        }

        function generateStructures(seed) {
            const structures = [];
            const count = Math.floor(seededRandom(seed + 13) * 3);
            const types = ['🏯', '🏰', '⛩️', '🗼', '🏛️'];
            for (let i = 0; i < count; i++) {
                structures.push({
                    type: types[Math.floor(seededRandom(seed + i + 14) * types.length)],
                    x: seededRandom(seed + i + 15) * 800,
                    y: seededRandom(seed + i + 16) * 800
                });
            }
            return structures;
        }

        // Генерация задания
        function generateQuest() {
            const template = questTemplates[Math.floor(Math.random() * questTemplates.length)];
            const count = Math.floor(Math.random() * 5) + 3;
            return {
                ...template,
                id: Date.now(),
                desc: template.desc.replace('{count}', count).replace('{level}', player.level + 5),
                target: count,
                current: 0,
                completed: false
            };
        }

        // Инициализация
        function init() {
            currentPlanet = generatePlanet(0, 0, 0);
            currentPlanet.name = 'Земля';
            currentPlanet.discovered = true;
            
            // Стартовые задания
            for (let i = 0; i < 3; i++) {
                quests.push(generateQuest());
            }
            
            updateUI();
            gameLoop();
        }

        // Обновление UI
        function updateUI() {
            document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
            document.getElementById('kiBar').style.width = (player.ki / player.maxKi * 100) + '%';
            document.getElementById('xpBar').style.width = (player.xp / player.xpToNext * 100) + '%';
            document.getElementById('levelVal').textContent = player.level;
            document.getElementById('coords').textContent = `${Math.floor(player.x)}, ${Math.floor(player.y)}`;
            document.getElementById('planetName').textContent = currentPlanet.name;
            document.getElementById('zeni').textContent = player.zeni;
            document.getElementById('weatherDisplay').textContent = `${currentPlanet.weatherEmoji} ${getWeatherName(currentPlanet.weather)}`;
            document.getElementById('currentPlanetInfo').textContent = currentPlanet.name;
            document.getElementById('travelWeather').textContent = `${currentPlanet.weatherEmoji} ${getWeatherName(currentPlanet.weather)}`;
            
            updateQuests();
            updateInventory();
            updatePowers();
        }

        function getWeatherName(weather) {
            const names = {
                'clear': 'Ясно',
                'cloudy': 'Облачно',
                'rain': 'Дождь',
                'storm': 'Гроза',
                'aurora': 'Северное сияние'
            };
            return names[weather] || weather;
        }

        function updateQuests() {
            const list = document.getElementById('questList');
            list.innerHTML = '';
            quests.forEach(quest => {
                if (!quest.completed) {
                    const div = document.createElement('div');
                    div.className = 'quest-item';
                    div.innerHTML = `
                        <div class="quest-title">${quest.title}</div>
                        <div class="quest-desc">${quest.desc}</div>
                        <div class="quest-reward">Награда: ${quest.reward.xp} XP, ${quest.reward.zeni} Z</div>
                        <div style="color: #00d4ff; margin-top: 5px;">Прогресс: ${quest.current}/${quest.target}</div>
                    `;
                    list.appendChild(div);
                }
            });
        }

        function updateInventory() {
            const grid = document.getElementById('inventory');
            grid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                if (player.inventory[i]) {
                    slot.textContent = player.inventory[i].emoji;
                    slot.title = `${player.inventory[i].name} x${player.inventory[i].amount}`;
                }
                grid.appendChild(slot);
            }
        }

        function updatePowers() {
            const list = document.getElementById('powersList');
            list.innerHTML = '';
            const allPowers = [
                { id: 'ki_blast', name: 'Ки-бласт', cost: 10, unlocked: true },
                { id: 'kamehameha', name: 'Камехамеха', cost: 30, unlocked: player.level >= 5 },
                { id: 'galick_gun', name: 'Галик-ган', cost: 35, unlocked: player.level >= 10 },
                { id: 'spirit_bomb', name: 'Духовой бомба', cost: 50, unlocked: player.level >= 15 },
                { id: 'instant_transmission', name: 'Мгновенная передача', cost: 20, unlocked: player.level >= 20 },
                { id: 'super_saiyan', name: 'Супер Сайян', cost: 100, unlocked: player.level >= 30 }
            ];
            
            allPowers.forEach(power => {
                const div = document.createElement('div');
                div.className = `power-item ${power.unlocked ? 'unlocked' : 'locked'}`;
                div.innerHTML = `
                    <div style="font-weight: bold;">${power.name}</div>
                    <div style="font-size: 0.8em; color: #00d4ff;">⚡ ${power.cost} ки</div>
                `;
                if (power.unlocked) {
                    div.onclick = () => usePower(power.id, power.cost);
                }
                list.appendChild(div);
            });
        }

        // Игровой цикл
        function gameLoop() {
            render();
            update();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Регенерация ки
            if (player.ki < player.maxKi) {
                player.ki += 0.1;
            }
            
            // Случайные события
            if (Math.random() < 0.001) {
                addMessage('⚡ Вы чувствуете мощную энергию поблизости...');
            }
        }

        function render() {
            // Очистка
            ctx.fillStyle = getSkyColor();
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рендер звезд (если в космосе или высоко)
            if (player.flying || currentPlanet.type === 'void') {
                renderStars();
            }
            
            // Рендер планеты
            renderPlanet();
            
            // Рендер игрока
            renderPlayer();
            
            // Рендер мобов
            renderMobs();
            
            // Рендер ресурсов
            renderResources();
            
            // Рендер структур
            renderStructures();
            
            // Эффекты погоды
            renderWeather();
        }

        function getSkyColor() {
            if (player.flying) {
                return '#000428';
            }
            switch(currentPlanet.weather) {
                case 'clear': return 'linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #98FB98 100%)';
                case 'cloudy': return 'linear-gradient(to bottom, #708090 0%, #A9A9A9 50%, #808080 100%)';
                case 'rain': return 'linear-gradient(to bottom, #2F4F4F 0%, #708090 50%, #778899 100%)';
                case 'storm': return 'linear-gradient(to bottom, #000000 0%, #2F4F4F 50%, #708090 100%)';
                case 'aurora': return 'linear-gradient(to bottom, #000428 0%, #004e92 50%, #00ff88 100%)';
                default: return '#87CEEB';
            }
        }

        function renderStars() {
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 200; i++) {
                const x = (Math.sin(i * 123.45) * 43758.5453 % 1) * canvas.width;
                const y = (Math.cos(i * 67.89) * 23421.6789 % 1) * canvas.height;
                const size = Math.random() * 2;
                ctx.globalAlpha = Math.random() * 0.8 + 0.2;
                ctx.beginPath();
                ctx.arc(Math.abs(x), Math.abs(y), size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function renderPlanet() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Планета (фон)
            if (!player.flying) {
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 400);
                gradient.addColorStop(0, getPlanetColor());
                gradient.addColorStop(1, '#000');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 400, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function getPlanetColor() {
            const colors = {
                'earth': '#4a90e2',
                'namek': '#5cb85c',
                'vegeta': '#d9534f',
                'frieza': '#5bc0de',
                'cell': '#f0ad4e',
                'kaio': '#9b59b6',
                'void': '#2c3e50',
                'lava': '#e74c3c'
            };
            return colors[currentPlanet.type] || '#4a90e2';
        }

        function renderPlayer() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Эффект ауры если супер сайян
            if (player.powers.includes('super_saiyan')) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Игрок
            ctx.fillStyle = '#ff8c00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Направление
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX + 10, centerY - 5, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function renderMobs() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            currentPlanet.mobs.forEach(mob => {
                const dx = mob.x - player.x;
                const dy = mob.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 500) {
                    const screenX = centerX + dx / 2;
                    const screenY = centerY + dy / 2;
                    
                    // Моб
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(mob.emoji, screenX, screenY);
                    
                    // HP бар
                    const hpPercent = mob.currentHp / mob.hp;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(screenX - 20, screenY - 35, 40, 5);
                    ctx.fillStyle = hpPercent > 0.5 ? '#0f0' : hpPercent > 0.25 ? '#ff0' : '#f00';
                    ctx.fillRect(screenX - 20, screenY - 35, 40 * hpPercent, 5);
                    
                    // Имя
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Orbitron';
                    ctx.fillText(mob.name, screenX, screenY - 40);
                }
            });
        }

        function renderResources() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            currentPlanet.resources.forEach(res => {
                const dx = res.x - player.x;
                const dy = res.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 500) {
                    const screenX = centerX + dx / 2;
                    const screenY = centerY + dy / 2;
                    
                    ctx.font = '25px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(res.emoji, screenX, screenY);
                }
            });
        }

        function renderStructures() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            currentPlanet.structures.forEach(struct => {
                const dx = struct.x - player.x;
                const dy = struct.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 500) {
                    const screenX = centerX + dx / 2;
                    const screenY = centerY + dy / 2;
                    
                    ctx.font = '40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(struct.type, screenX, screenY);
                }
            });
        }

        function renderWeather() {
            if (currentPlanet.weather === 'rain') {
                ctx.strokeStyle = 'rgba(173, 216, 230, 0.5)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 5, y + 20);
                    ctx.stroke();
                }
            } else if (currentPlanet.weather === 'storm') {
                if (Math.random() < 0.05) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
        }

        // Действия
        function attack() {
            const nearest = findNearestMob();
            if (nearest) {
                const dmg = player.power / 10;
                nearest.currentHp -= dmg;
                addMessage(`⚔️ Атака! Нанесено ${Math.floor(dmg)} урона ${nearest.name}`);
                
                if (nearest.currentHp <= 0) {
                    killMob(nearest);
                }
                
                updateUI();
            } else {
                addMessage('Нет врагов поблизости!');
            }
        }

        function findNearestMob() {
            let nearest = null;
            let minDist = 200;
            
            currentPlanet.mobs.forEach(mob => {
                const dx = mob.x - player.x;
                const dy = mob.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist && mob.currentHp > 0) {
                    minDist = dist;
                    nearest = mob;
                }
            });
            
            return nearest;
        }

        function killMob(mob) {
            addMessage(`💀 ${mob.name} повержен! +${mob.xp} XP, +${mob.zeni} Z`);
            player.xp += mob.xp;
            player.zeni += mob.zeni;
            mob.currentHp = 0;
            
            // Проверка заданий
            quests.forEach(q => {
                if (q.type === 'kill' && !q.completed) {
                    q.current++;
                    if (q.current >= q.target) {
                        completeQuest(q);
                    }
                }
            });
            
            checkLevelUp();
            updateUI();
        }

        function useSpecial() {
            if (player.ki >= 10) {
                player.ki -= 10;
                const nearest = findNearestMob();
                if (nearest) {
                    const dmg = player.power / 5;
                    nearest.currentHp -= dmg;
                    addMessage(`✨ Ки-бласт! Нанесено ${Math.floor(dmg)} урона!`);
                    
                    if (nearest.currentHp <= 0) {
                        killMob(nearest);
                    }
                } else {
                    // Выстрел в пустоту
                    addMessage('✨ Ки-бласт в небо!');
                }
                updateUI();
            } else {
                addMessage('❌ Недостаточно ки!');
            }
        }

        function usePower(powerId, cost) {
            if (player.ki >= cost) {
                player.ki -= cost;
                
                switch(powerId) {
                    case 'kamehameha':
                        addMessage('💙 КА-МЕ-ХА-МЕ-ХА!!!');
                        currentPlanet.mobs.forEach(mob => {
                            if (mob.currentHp > 0) {
                                mob.currentHp -= player.power / 3;
                                if (mob.currentHp <= 0) killMob(mob);
                            }
                        });
                        break;
                    case 'instant_transmission':
                        addMessage('⚡ Мгновенная передача!');
                        player.x += (Math.random() - 0.5) * 500;
                        player.y += (Math.random() - 0.5) * 500;
                        break;
                    case 'super_saiyan':
                        if (!player.powers.includes('super_saiyan')) {
                            player.powers.push('super_saiyan');
                            player.power *= 2;
                            addMessage('🔥 СУПЕР САЙЯН! Сила удвоена!');
                        }
                        break;
                }
                
                updateUI();
            } else {
                addMessage('❌ Недостаточно ки!');
            }
        }

        function gather() {
            let found = false;
            currentPlanet.resources.forEach(res => {
                const dx = res.x - player.x;
                const dy = res.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 50 && res.amount > 0) {
                    found = true;
                    res.amount--;
                    
                    // Добавление в инвентарь
                    const existing = player.inventory.find(i => i.name === res.name);
                    if (existing) {
                        existing.amount++;
                    } else {
                        player.inventory.push({ ...res, amount: 1 });
                    }
                    
                    addMessage(`📦 Получено: ${res.emoji} ${res.name}`);
                    player.zeni += res.value;
                    
                    // Проверка заданий
                    quests.forEach(q => {
                        if (q.type === 'gather' && !q.completed) {
                            q.current++;
                            if (q.current >= q.target) {
                                completeQuest(q);
                            }
                        }
                    });
                }
            });
            
            if (!found) {
                addMessage('🔍 Ресурсы не найдены поблизости');
            }
            updateUI();
        }

        function build() {
            addMessage('🔨 Система строительства в разработке...');
        }

        function completeQuest(quest) {
            quest.completed = true;
            player.xp += quest.reward.xp;
            player.zeni += quest.reward.zeni;
            addMessage(`✅ Задание выполнено: ${quest.title}!`);
            addMessage(`🎁 Награда: ${quest.reward.xp} XP, ${quest.reward.zeni} Z`);
            checkLevelUp();
            
            // Новое задание
            setTimeout(() => {
                quests.push(generateQuest());
                updateUI();
            }, 2000);
        }

        function checkLevelUp() {
            while (player.xp >= player.xpToNext) {
                player.xp -= player.xpToNext;
                player.level++;
                player.xpToNext = Math.floor(player.xpToNext * 1.5);
                player.maxHp += 20;
                player.maxKi += 10;
                player.hp = player.maxHp;
                player.ki = player.maxKi;
                player.power += 500;
                
                addMessage(`🎉 НОВЫЙ УРОВЕНЬ! Теперь вы ${player.level} уровня!`);
                addMessage(`💪 Сила увеличена до ${player.power}!`);
                
                // Разблокировка способностей
                if (player.level === 5) {
                    addMessage('🔓 Разблокирована способность: Камехамеха!');
                } else if (player.level === 10) {
                    addMessage('🔓 Разблокирована способность: Галик-ган!');
                } else if (player.level === 30) {
                    addMessage('🔓 Разблокирована способность: Супер Сайян!');
                }
            }
        }

        // Путешествия
        function openTravel() {
            document.getElementById('travelModal').style.display = 'flex';
        }

        function closeTravel() {
            document.getElementById('travelModal').style.display = 'none';
            document.getElementById('travelInfo').style.display = 'none';
        }

        function travelToRandom() {
            const x = Math.floor(Math.random() * 2000) - 1000;
            const y = Math.floor(Math.random() * 2000) - 1000;
            const z = Math.floor(Math.random() * 10) - 5;
            travelTo(x, y, z);
        }

        function travelToCoords() {
            const x = parseInt(document.getElementById('coordX').value) || 0;
            const y = parseInt(document.getElementById('coordY').value) || 0;
            const z = parseInt(document.getElementById('coordZ').value) || 0;
            travelTo(x, y, z);
        }

        function travelTo(x, y, z) {
            closeTravel();
            addMessage('🚀 Запуск двигателей...');
            
            // Анимация полета
            let progress = 0;
            const flyInterval = setInterval(() => {
                progress += 0.05;
                player.flying = true;
                
                if (progress >= 1) {
                    clearInterval(flyInterval);
                    arriveAtPlanet(x, y, z);
                }
            }, 100);
        }

        function arriveAtPlanet(x, y, z) {
            currentPlanet = generatePlanet(x, y, z);
            player.x = 0;
            player.y = 0;
            player.flying = false;
            
            addMessage(`🪐 Прибытие на планету: ${currentPlanet.name}`);
            addMessage(`Тип: ${currentPlanet.type}, Погода: ${currentPlanet.weatherEmoji}`);
            addMessage(`Температура: ${currentPlanet.temperature}°C, Гравитация: ${currentPlanet.gravity}g`);
            addMessage(`Спутники: ${currentPlanet.satellites.join(', ') || 'Нет'}`);
            
            // Проверка задания на исследование
            quests.forEach(q => {
                if (q.type === 'explore' && !q.completed) {
                    q.current++;
                    if (q.current >= q.target) {
                        completeQuest(q);
                    }
                }
            });
            
            updateUI();
        }

        function addMessage(text) {
            const log = document.getElementById('messageLog');
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            log.appendChild(msg);
            log.scrollTop = log.scrollHeight;
            
            // Ограничение сообщений
            while (log.children.length > 20) {
                log.removeChild(log.firstChild);
            }
        }

        // Управление
        window.addEventListener('keydown', (e) => {
            const speed = player.speed;
            switch(e.key) {
                case 'w': case 'ArrowUp': player.y -= speed; break;
                case 's': case 'ArrowDown': player.y += speed; break;
                case 'a': case 'ArrowLeft': player.x -= speed; break;
                case 'd': case 'ArrowRight': player.x += speed; break;
                case ' ': player.flying = !player.flying; break;
                case 'f': attack(); break;
                case 'e': gather(); break;
            }
            updateUI();
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Старт
        init();
    </script>
</body>
</html>
