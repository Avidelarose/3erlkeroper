<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball: Galactic Conquest</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4d 50%, #0f1535 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 0, 0.2), transparent);
            border-bottom: 3px solid #ff8c00;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.5);
        }

        h1 {
            font-size: 3em;
            color: #ff8c00;
            text-shadow: 0 0 20px #ff8c00, 0 0 40px #ff8c00;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            color: #00d4ff;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00d4ff;
        }

        .game-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff8c00;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        }

        .panel-title {
            color: #ff8c00;
            font-size: 1.5em;
            margin-bottom: 15px;
            border-bottom: 2px solid #ff8c00;
            padding-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #1a1f4d, #0f1535);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .stat-value {
            font-size: 2em;
            color: #00d4ff;
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            font-size: 0.9em;
        }

        .planets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .planet-card {
            background: linear-gradient(135deg, rgba(26, 31, 77, 0.9), rgba(15, 21, 53, 0.9));
            border: 3px solid #444;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .planet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.5);
        }

        .planet-card.own {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .planet-card.enemy {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .planet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .planet-name {
            font-size: 1.3em;
            color: #ff8c00;
        }

        .planet-type {
            background: #ff8c00;
            color: #000;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
        }

        .planet-image {
            width: 100%;
            height: 150px;
            background: radial-gradient(circle, #2a3f7f, #0a0e27);
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            position: relative;
            overflow: hidden;
        }

        .planet-image::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .planet-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .planet-stat {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }

        .health-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid #555;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff8c00, #00ff00);
            transition: width 0.5s;
            position: relative;
        }

        .health-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .characters-section {
            margin-top: 15px;
        }

        .character-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .character-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ff8c00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #1a1f4d, #0f1535);
        }

        .character-avatar:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px #ff8c00;
        }

        .btn {
            background: linear-gradient(135deg, #ff8c00, #ff6600);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            margin: 5px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-attack {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
        }

        .btn-attack:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .btn-defend {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }

        .battle-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .battle-content {
            background: linear-gradient(135deg, #1a1f4d, #0f1535);
            border: 3px solid #ff8c00;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(255, 140, 0, 0.5);
        }

        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            gap: 20px;
        }

        .fighter {
            text-align: center;
            flex: 1;
        }

        .fighter-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ff8c00;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            background: radial-gradient(circle, #2a3f7f, #0a0e27);
            position: relative;
        }

        .power-level {
            color: #ff8c00;
            font-size: 1.5em;
            margin: 10px 0;
        }

        .vs {
            font-size: 3em;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            animation: vsPulse 1s infinite;
        }

        @keyframes vsPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .energy-bar {
            width: 100%;
            height: 30px;
            background: #333;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #555;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ff8c00);
            transition: width 0.3s;
        }

        .battle-log {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #ff8c00;
            padding-left: 10px;
        }

        .roster-panel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .character-card {
            background: linear-gradient(135deg, rgba(26, 31, 77, 0.9), rgba(15, 21, 53, 0.9));
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .character-card:hover {
            border-color: #ff8c00;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 140, 0, 0.4);
        }

        .character-card.selected {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        }

        .char-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .char-name {
            color: #ff8c00;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .char-power {
            color: #00d4ff;
            font-size: 0.9em;
        }

        .resources {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .resource-icon {
            font-size: 1.2em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            background: rgba(255, 140, 0, 0.2);
            border: 2px solid #ff8c00;
            color: #ff8c00;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: #ff8c00;
            color: #000;
        }

        .tab:hover {
            background: rgba(255, 140, 0, 0.4);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .battle-arena { flex-direction: column; }
            .planets-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <header>
            <h1>⚡ DRAGON BALL ⚡</h1>
            <div class="subtitle">GALACTIC CONQUEST</div>
        </header>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-value" id="totalPlanets">0</div>
                <div class="stat-label">Планет захвачено</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalPower">0</div>
                <div class="stat-label">Общая мощь</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="zeni">1000</div>
                <div class="stat-label">Зени</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="energyCrystals">0</div>
                <div class="stat-label">Кристаллы энергии</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('galaxy')">🌌 Галактика</div>
            <div class="tab" onclick="switchTab('roster')">👥 Отряд</div>
            <div class="tab" onclick="switchTab('characters')">⚔️ Персонажи</div>
        </div>

        <div id="galaxyTab" class="tab-content">
            <div class="game-panel">
                <div class="panel-title">🪐 Ваша планета</div>
                <div id="homePlanet"></div>
            </div>

            <div class="game-panel">
                <div class="panel-title">🎯 Цели для захвата</div>
                <div class="planets-grid" id="enemyPlanets"></div>
            </div>
        </div>

        <div id="rosterTab" class="tab-content hidden">
            <div class="game-panel">
                <div class="panel-title">👥 Ваши персонажи на планетах</div>
                <div id="planetRoster"></div>
            </div>
        </div>

        <div id="charactersTab" class="tab-content hidden">
            <div class="game-panel">
                <div class="panel-title">⚔️ Все доступные воины</div>
                <div class="roster-panel" id="allCharacters"></div>
            </div>
        </div>
    </div>

    <div class="battle-modal" id="battleModal">
        <div class="battle-content">
            <h2 style="text-align: center; color: #ff8c00; margin-bottom: 20px;">БИТВА ЗА ПЛАНЕТУ</h2>
            
            <div class="battle-arena">
                <div class="fighter">
                    <div class="fighter-image" id="attackerImage">👤</div>
                    <div class="power-level" id="attackerPower">0</div>
                    <div id="attackerName">Атакующий</div>
                    <div class="energy-bar">
                        <div class="energy-fill" id="attackerEnergy" style="width: 100%"></div>
                    </div>
                    <div class="health-bar">
                        <div class="health-fill" id="attackerHealth" style="width: 100%"></div>
                    </div>
                </div>

                <div class="vs">VS</div>

                <div class="fighter">
                    <div class="fighter-image" id="defenderImage">👤</div>
                    <div class="power-level" id="defenderPower">0</div>
                    <div id="defenderName">Защитник</div>
                    <div class="energy-bar">
                        <div class="energy-fill" id="defenderEnergy" style="width: 100%"></div>
                    </div>
                    <div class="health-bar">
                        <div class="health-fill" id="defenderHealth" style="width: 100%"></div>
                    </div>
                </div>
            </div>

            <div class="battle-log" id="battleLog"></div>

            <div style="text-align: center;">
                <button class="btn btn-attack" onclick="battleRound()">⚔️ Атака</button>
                <button class="btn btn-defend" onclick="useSpecial()">✨ Специальная атака</button>
                <button class="btn" onclick="closeBattle()">🏃 Отступить</button>
            </div>
        </div>
    </div>

    <script>
        // Игровые данные
        const characters = [
            { id: 1, name: 'Goku', icon: '🐉', power: 9000, maxHealth: 100, special: 'Kamehameha', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Goku&backgroundColor=ff8c00' },
            { id: 2, name: 'Vegeta', icon: '👑', power: 8500, maxHealth: 95, special: 'Final Flash', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Vegeta&backgroundColor=0066cc' },
            { id: 3, name: 'Gohan', icon: '', power: 8800, maxHealth: 90, special: 'Masenko', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Gohan&backgroundColor=ff6600' },
            { id: 4, name: 'Piccolo', icon: '👹', power: 7500, maxHealth: 110, special: 'Special Beam Cannon', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Piccolo&backgroundColor=00cc66' },
            { id: 5, name: 'Krillin', icon: '🥋', power: 4000, maxHealth: 75, special: 'Destructo Disc', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Krillin&backgroundColor=ff9900' },
            { id: 6, name: 'Frieza', icon: '😈', power: 9500, maxHealth: 85, special: 'Death Beam', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Frieza&backgroundColor=cc00cc' },
            { id: 7, name: 'Cell', icon: '🦗', power: 9200, maxHealth: 100, special: 'Solar Kamehameha', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cell&backgroundColor=00cc00' },
            { id: 8, name: 'Majin Buu', icon: '👾', power: 8700, maxHealth: 120, special: 'Human Extinction Attack', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Buu&backgroundColor=ff99cc' },
            { id: 9, name: 'Trunks', icon: '⚔️', power: 8000, maxHealth: 85, special: 'Burning Attack', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Trunks&backgroundColor=9900cc' },
            { id: 10, name: 'Goten', icon: '🌟', power: 7000, maxHealth: 80, special: 'Kamehameha', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Goten&backgroundColor=ff6600' },
            { id: 11, name: 'Android 18', icon: '🤖', power: 7800, maxHealth: 90, special: 'Energy Blast', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Android18&backgroundColor=cccccc' },
            { id: 12, name: 'Beerus', icon: '🐱', power: 10000, maxHealth: 95, special: 'Hakai', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Beerus&backgroundColor=9900cc' }
        ];

        const planetTypes = ['Пустынная', 'Ледяная', 'Вулканическая', 'Океаническая', 'Лесная', 'Горная', 'Техно', 'Магическая'];
        const planetEmojis = ['', '️', '️', '🌲', '🏜️', '❄️', '🌊', '⚡'];

        let gameState = {
            zeni: 1000,
            energyCrystals: 0,
            homePlanet: null,
            ownedPlanets: [],
            enemyPlanets: [],
            selectedCharacter: null,
            battle: null
        };

        // Инициализация звезд
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Генерация случайной планеты
        function generatePlanet(isHome = false) {
            const typeIndex = Math.floor(Math.random() * planetTypes.length);
            const planet = {
                id: Date.now() + Math.random(),
                name: `Planet-${Math.floor(Math.random() * 9999)}`,
                type: planetTypes[typeIndex],
                emoji: planetEmojis[typeIndex],
                health: isHome ? 1000 : Math.floor(Math.random() * 500) + 200,
                maxHealth: isHome ? 1000 : Math.floor(Math.random() * 500) + 200,
                resources: {
                    zeni: Math.floor(Math.random() * 500) + 100,
                    crystals: Math.floor(Math.random() * 10) + 1
                },
                defender: isHome ? null : characters[Math.floor(Math.random() * characters.length)],
                isOwned: isHome,
                characters: []
            };
            
            if (isHome) {
                planet.name = 'Earth (Земля)';
                planet.emoji = '🌍';
            }
            
            return planet;
        }

        // Инициализация игры
        function initGame() {
            createStars();
            gameState.homePlanet = generatePlanet(true);
            gameState.ownedPlanets.push(gameState.homePlanet);
            
            // Генерация вражеских планет
            for (let i = 0; i < 8; i++) {
                gameState.enemyPlanets.push(generatePlanet());
            }
            
            updateUI();
        }

        // Обновление интерфейса
        function updateUI() {
            // Обновление статистики
            document.getElementById('totalPlanets').textContent = gameState.ownedPlanets.length;
            const totalPower = gameState.ownedPlanets.reduce((sum, p) => 
                sum + p.characters.reduce((cSum, c) => cSum + c.power, 0), 0);
            document.getElementById('totalPower').textContent = totalPower;
            document.getElementById('zeni').textContent = gameState.zeni;
            document.getElementById('energyCrystals').textContent = gameState.energyCrystals;

            // Отображение домашней планеты
            renderPlanet(gameState.homePlanet, 'homePlanet', true);
            
            // Отображение вражеских планет
            const enemyContainer = document.getElementById('enemyPlanets');
            enemyContainer.innerHTML = '';
            gameState.enemyPlanets.forEach(planet => {
                enemyContainer.appendChild(createPlanetCard(planet, false));
            });

            // Обновление ростера
            updateRoster();
            
            // Обновление списка персонажей
            updateCharacterList();
        }

        // Создание карточки планеты
        function createPlanetCard(planet, isOwned) {
            const card = document.createElement('div');
            card.className = `planet-card ${isOwned ? 'own' : 'enemy'}`;
            card.innerHTML = `
                <div class="planet-header">
                    <div class="planet-name">${planet.name}</div>
                    <div class="planet-type">${planet.type}</div>
                </div>
                <div class="planet-image">${planet.emoji}</div>
                <div class="planet-stats">
                    <div class="planet-stat">
                        <div>❤️ Здоровье</div>
                        <div>${planet.health}/${planet.maxHealth}</div>
                    </div>
                    <div class="planet-stat">
                        <div>💰 Ресурсы</div>
                        <div>${planet.resources.zeni} Z</div>
                    </div>
                </div>
                <div class="health-bar">
                    <div class="health-fill" style="width: ${(planet.health/planet.maxHealth)*100}%"></div>
                </div>
                ${planet.defender ? `
                    <div class="characters-section">
                        <div>🛡️ Защитник: ${planet.defender.name} (${planet.defender.power})</div>
                    </div>
                ` : ''}
                <div class="resources">
                    <div class="resource">
                        <span class="resource-icon">💎</span>
                        <span>${planet.resources.crystals}</span>
                    </div>
                </div>
                ${!isOwned ? `
                    <div style="margin-top: 15px;">
                        <button class="btn btn-attack" onclick="startBattle(${planet.id})">⚔️ Атаковать</button>
                    </div>
                ` : `
                    <div style="margin-top: 15px;">
                        <button class="btn" onclick="collectResources(${planet.id})">💰 Собрать ресурсы</button>
                    </div>
                `}
            `;
            return card;
        }

        // Отображение планеты
        function renderPlanet(planet, containerId, isHome) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            container.appendChild(createPlanetCard(planet, isHome));
        }

        // Начало битвы
        function startBattle(planetId) {
            const planet = gameState.enemyPlanets.find(p => p.id === planetId);
            if (!planet) return;

            // Выбор персонажа для атаки
            const availableChars = characters.filter(c => 
                !gameState.ownedPlanets.some(p => p.characters.some(pc => pc.id === c.id))
            );

            if (availableChars.length === 0) {
                alert('Все персонажи заняты! Освободите кого-нибудь.');
                return;
            }

            gameState.battle = {
                planet: planet,
                attacker: availableChars[0],
                defender: planet.defender || { name: 'Без защитника', power: 1000, maxHealth: 100 },
                attackerHealth: availableChars[0].maxHealth,
                defenderHealth: planet.defender ? planet.defender.maxHealth : 200,
                round: 1
            };

            showBattleModal();
        }

        // Показать окно битвы
        function showBattleModal() {
            const modal = document.getElementById('battleModal');
            const battle = gameState.battle;
            
            document.getElementById('attackerImage').textContent = battle.attacker.icon;
            document.getElementById('attackerName').textContent = battle.attacker.name;
            document.getElementById('attackerPower').textContent = battle.attacker.power;
            document.getElementById('attackerHealth').style.width = (battle.attackerHealth / battle.attacker.maxHealth * 100) + '%';
            
            document.getElementById('defenderImage').textContent = battle.defender.icon || '👾';
            document.getElementById('defenderName').textContent = battle.defender.name;
            document.getElementById('defenderPower').textContent = battle.defender.power;
            document.getElementById('defenderHealth').style.width = (battle.defenderHealth / (battle.defender.maxHealth || 200) * 100) + '%';
            
            document.getElementById('battleLog').innerHTML = `<div class="log-entry">Битва началась! ${battle.attacker.name} против ${battle.defender.name}</div>`;
            
            modal.style.display = 'flex';
        }

        // Раунд битвы
        function battleRound() {
            const battle = gameState.battle;
            const log = document.getElementById('battleLog');
            
            // Атака игрока
            const attackDmg = Math.floor(battle.attacker.power / 100) + Math.floor(Math.random() * 500);
            battle.defenderHealth -= attackDmg;
            log.innerHTML += `<div class="log-entry">⚔️ ${battle.attacker.name} наносит ${attackDmg} урона!</div>`;
            
            if (battle.defenderHealth <= 0) {
                endBattle(true);
                return;
            }
            
            // Контратака
            if (battle.defender.power > 0) {
                const defendDmg = Math.floor(battle.defender.power / 150) + Math.floor(Math.random() * 300);
                battle.attackerHealth -= defendDmg;
                log.innerHTML += `<div class="log-entry">🛡️ ${battle.defender.name} контратакует на ${defendDmg} урона!</div>`;
            }
            
            // Обновление UI
            document.getElementById('attackerHealth').style.width = (battle.attackerHealth / battle.attacker.maxHealth * 100) + '%';
            document.getElementById('defenderHealth').style.width = Math.max(0, (battle.defenderHealth / (battle.defender.maxHealth || 200) * 100)) + '%';
            
            if (battle.attackerHealth <= 0) {
                endBattle(false);
            }
            
            log.scrollTop = log.scrollHeight;
        }

        // Специальная атака
        function useSpecial() {
            const battle = gameState.battle;
            const log = document.getElementById('battleLog');
            
            const specialDmg = Math.floor(battle.attacker.power / 50);
            battle.defenderHealth -= specialDmg;
            
            log.innerHTML += `<div class="log-entry" style="color: #ff8c00">✨ ${battle.attacker.name} использует ${battle.attacker.special}! ${specialDmg} урона!</div>`;
            
            if (battle.defenderHealth <= 0) {
                endBattle(true);
            } else {
                // Контратака
                const defendDmg = Math.floor(battle.defender.power / 100);
                battle.attackerHealth -= defendDmg;
                log.innerHTML += `<div class="log-entry">🛡️ ${battle.defender.name} отвечает на ${defendDmg} урона!</div>`;
                
                document.getElementById('attackerHealth').style.width = (battle.attackerHealth / battle.attacker.maxHealth * 100) + '%';
                document.getElementById('defenderHealth').style.width = Math.max(0, (battle.defenderHealth / (battle.defender.maxHealth || 200) * 100)) + '%';
                
                if (battle.attackerHealth <= 0) {
                    endBattle(false);
                }
            }
            
            log.scrollTop = log.scrollHeight;
        }

        // Конец битвы
        function endBattle(victory) {
            const battle = gameState.battle;
            const log = document.getElementById('battleLog');
            
            if (victory) {
                log.innerHTML += `<div class="log-entry" style="color: #00ff00; font-weight: bold">🎉 ПОБЕДА! Планета захвачена!</div>`;
                
                // Награды
                gameState.zeni += battle.planet.resources.zeni;
                gameState.energyCrystals += battle.planet.resources.crystals;
                
                // Перемещение планеты
                const planetIndex = gameState.enemyPlanets.findIndex(p => p.id === battle.planet.id);
                if (planetIndex > -1) {
                    const conqueredPlanet = gameState.enemyPlanets.splice(planetIndex, 1)[0];
                    conqueredPlanet.isOwned = true;
                    conqueredPlanet.defender = null;
                    conqueredPlanet.characters.push(battle.attacker);
                    gameState.ownedPlanets.push(conqueredPlanet);
                    
                    // Генерация новой вражеской планеты
                    setTimeout(() => {
                        gameState.enemyPlanets.push(generatePlanet());
                        updateUI();
                    }, 2000);
                }
                
                setTimeout(() => {
                    closeBattle();
                    updateUI();
                }, 2000);
            } else {
                log.innerHTML += `<div class="log-entry" style="color: #ff0000; font-weight: bold">💀 ПОРАЖЕНИЕ! Отступление...</div>`;
                setTimeout(() => {
                    closeBattle();
                }, 2000);
            }
        }

        // Закрыть битву
        function closeBattle() {
            document.getElementById('battleModal').style.display = 'none';
            gameState.battle = null;
        }

        // Сбор ресурсов
        function collectResources(planetId) {
            const planet = gameState.ownedPlanets.find(p => p.id === planetId);
            if (!planet) return;
            
            gameState.zeni += planet.resources.zeni;
            gameState.energyCrystals += planet.resources.crystals;
            
            // Регенерация ресурсов
            planet.resources.zeni = Math.floor(Math.random() * 300) + 100;
            planet.resources.crystals = Math.floor(Math.random() * 5) + 1;
            
            alert(`Собрано: ${planet.resources.zeni} Зени и ${planet.resources.crystals} кристаллов!`);
            updateUI();
        }

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.remove('hidden');
        }

        // Обновление ростера
        function updateRoster() {
            const container = document.getElementById('planetRoster');
            container.innerHTML = '';
            
            gameState.ownedPlanets.forEach(planet => {
                const planetDiv = document.createElement('div');
                planetDiv.className = 'game-panel';
                planetDiv.innerHTML = `
                    <div class="panel-title">🪐 ${planet.name}</div>
                    <div class="character-list">
                        ${planet.characters.map(c => `
                            <div class="character-avatar" title="${c.name} (${c.power})">
                                ${c.icon}
                            </div>
                        `).join('')}
                        ${planet.characters.length === 0 ? '<div style="color: #666">Нет персонажей</div>' : ''}
                    </div>
                `;
                container.appendChild(planetDiv);
            });
        }

        // Обновление списка персонажей
        function updateCharacterList() {
            const container = document.getElementById('allCharacters');
            container.innerHTML = '';
            
            characters.forEach(char => {
                const isAssigned = gameState.ownedPlanets.some(p => 
                    p.characters.some(pc => pc.id === char.id)
                );
                
                const card = document.createElement('div');
                card.className = `character-card ${isAssigned ? 'assigned' : ''}`;
                card.innerHTML = `
                    <div class="char-icon">${char.icon}</div>
                    <div class="char-name">${char.name}</div>
                    <div class="char-power">💪 ${char.power}</div>
                    <div class="char-power">❤️ ${char.maxHealth}</div>
                    <div style="margin-top: 10px; color: ${isAssigned ? '#ff0000' : '#00ff00'}">
                        ${isAssigned ? 'Занят' : 'Свободен'}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Запуск игры
        window.onload = initGame;
    </script>
</body>
</html>
